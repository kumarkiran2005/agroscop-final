    <!--
      Type system — three faces, one job each. See src/index.css.
        Archivo      display / marking voice. Variable width axis carries the
                     stencilled lot-mark character at large sizes.
        Public Sans  interface + body. Institutional workhorse, holds up at
                     12px and under machine translation.
        JetBrains Mono  measurement only — weights, prices, lot numbers, dates.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Public+Sans:ital,wght@0,300..700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Noto Sans for 50-language website translation (Indian + global scripts) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Gurmukhi:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Hebrew:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap"

  <body>
    <!--
      DIRECTION CONTRACT — seed 8479fa27 · form 7 of 7 · mode persuade

      THESIS: AgroScope is a commodity house, not an app. Crop residue is a
      graded, weighed, lot-numbered good with a counterparty. Refuses the
      agri-SaaS arrangement it shipped as: soft green gradients, rounded
      feature cards, glow, and a display serif on every button.

      OWN-WORLD: The identity program of a global grain trader — stencilled
      shipping marks, weighbridge tickets, ledger rules. Working paper ground,
      one cargo-green ink, ochre reserved for measurement. Archivo expanded as
      the marking voice, Public Sans for interface, JetBrains Mono for any
      figure that was counted. Hairline rules and flat planes; no glow, no
      gradient text, no card-grid scaffold.

      STORY: A farmer or procurement buyer sees weights, grades and prices in
      the first viewport, believes real money moves here, and signs up.

      FIRST VIEWPORT: Full-width stencilled lot mark over a ledger of the five
      live residue grades with unit prices; primary action sits inline in that
      ledger, not floating above it.

      FORM: 7 of 7 on the grounded list (grain-sack stencil / port mark),
      seed key 8479fa27.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
    -->
    <!-- Hidden Google Translate widget - we trigger it from our language selector -->
    <div id="google_translate_element" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (typeof google === 'undefined' || !google.translate) return;
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'hi,ta,te,kn,ml,mr,gu,pa,bn,or,as,ur,en,zh-CN,ja,ko,ar,fr,de,es,pt,ru,it,tr,vi,th,id,ms,nl,pl,sv,no,da,fi,el,he,ro,hu,cs,sk,uk,hr,sr,bg,sw',
          layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <div id="root">
      <noscript>Enable JavaScript to run AgroScope.</noscript>
      <div id="app-loading" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F2F1EC;">

          AgroScope — loading
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
